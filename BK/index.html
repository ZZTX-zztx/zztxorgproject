    <script type="text/javascript">
        var currentVersion = '1.0.5';
        
        function showUpdateModal() {
            var modalHTML = `
                <div class="update-modal-overlay" id="updateModal">
                    <div class="update-modal">
                        <h2>🎉 更新成功！</h2>
                        <p>班刊已更新到新版本 v${currentVersion}</p>
                        <button onclick="closeUpdateModal()">知道了</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }
        
        function closeUpdateModal() {
            var modal = document.getElementById('updateModal');
            if (modal) {
                modal.style.animation = 'fadeIn 0.3s ease reverse';
                setTimeout(function() {
                    modal.remove();
                }, 300);
            }
        }
        
        function getUrlParam(name) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        function checkAndShowUpdate() {
            var showUpdate = getUrlParam('show_update');
            var version = getUrlParam('version') || currentVersion;
            var storedVersion = localStorage.getItem('lastVersion');
            
            console.log('URL参数 show_update:', showUpdate);
            console.log('URL参数 version:', version);
            console.log('localStorage版本:', storedVersion);
            
            // 如果URL参数指定了show_update，使用URL参数
            if (showUpdate === 'true') {
                console.log('显示更新弹窗 (URL参数)');
                showUpdateModal();
            } else if (showUpdate === 'false') {
                console.log('不显示弹窗 (URL参数)');
            } else {
                // 否则使用localStorage检测
                if (!storedVersion || storedVersion !== currentVersion) {
                    console.log('显示更新弹窗 (localStorage检测)');
                    showUpdateModal();
                } else {
                    console.log('不显示弹窗 (localStorage检测)');
                }
            }
            localStorage.setItem('lastVersion', currentVersion);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAndShowUpdate();
        });
        
        document.addEventListener('keydown', function(e) {
            // 禁用 F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // 禁用 Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            // 禁用 Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }
            // 禁用 Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
            // 禁用 Ctrl+U (查看源代码)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }
        });
